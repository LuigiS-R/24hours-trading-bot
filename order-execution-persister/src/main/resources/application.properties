spring.application.name=order-execution-persister
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/order_execution}
spring.datasource.username=${DATABASE_USERNAME:order_execution}
spring.datasource.password=${DATABASE_PASSWORD:order_execution}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# The order-execution service owns and migrates this schema.
spring.flyway.enabled=false

# RabbitMQ connection
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=trading-bot-dev
spring.rabbitmq.password=1234
spring.rabbitmq.virtual-host=trading-bot-dev-vhost
rabbitmq.assets.order-events-persister-queue=order-events-persister

alpaca.api.paper-trading-base-url=${ALPACA_PAPER_TRADING_BASE_URL:https://paper-api.alpaca.markets}

# This service uses an ORDER_EXECUTION_SERVICE service-account token for Account Service's internal API.
account-service.internal.base-url=${ACCOUNT_SERVICE_INTERNAL_BASE_URL:http://localhost:8081}
account-service.internal.service-token=${ORDER_EXECUTION_SERVICE_TOKEN:}
order-reconciliation.interval=${ORDER_RECONCILIATION_INTERVAL:PT5M}
