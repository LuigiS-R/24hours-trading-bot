spring.application.name=news-ingestion-service

# RabbitMQ connection
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:trading-bot-dev}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:1234}
spring.rabbitmq.virtual-host=${SPRING_RABBITMQ_VIRTUAL_HOST:trading-bot-dev-vhost}

#Alpaca API Config
alpaca.api.key=${ALPACA_API_KEY:}
alpaca.api.secret=${ALPACA_API_SECRET:}
alpaca.api.news-stream-url=${ALPACA_API_NEWS_STREAM_URL:wss://stream.data.alpaca.markets/v1beta1/news}
alpaca.api.subscription-message=${ALPACA_API_SUBSCRIPTION_MESSAGE:{"action":"subscribe","news":["*"]}}
