spring.application.name=order-execution-service

# RabbitMQ connection
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=trading-bot-dev
spring.rabbitmq.password=1234
spring.rabbitmq.virtual-host=trading-bot-dev-vhost

# RabbitMQ assets
rabbitmq.assets.orders-approved-queue=orders.approved
rabbitmq.assets.order-events-portfolio-queue=order-events-portfolio
rabbitmq.assets.order-events-notification-queue=order-events-notification
rabbitmq.assets.order-events-persister-queue=order-events-persister
rabbitmq.assets.order-events-exchange=order-events-fanout

#Alpaca API Config
alpaca.api.stream-url=wss://paper-api.alpaca.markets/stream
alpaca.api.subscription-message={"action": "listen", "data": {"streams": ["trade_updates"]}}
alpaca.api.order-endpoint=https://paper-api.alpaca.markets/v2/orders
alpaca.api.paper-trading-base-url=${ALPACA_PAPER_TRADING_BASE_URL:https://paper-api.alpaca.markets}
alpaca.api.key=${ALPACA_API_KEY:}
alpaca.api.secret=${ALPACA_API_SECRET:}
