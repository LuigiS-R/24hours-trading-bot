<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login — UnadØrned</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="stage">
    <div class="window">
      <header class="topbar">
        <div class="tb-left">
          <button class="hamburger" aria-label="menu">☰</button>
        </div>
        <div class="tb-center"></div>
        
      </header>

      <main class="hero">
        <div class="bg-placeholder" aria-hidden="true"></div>

        <aside class="login-card" id="authCard" data-mode="login">
          <h1>Tradify</h1>
          <p class="lead">The market never sleeps. Neither do we.</p>

          <form class="login-form" id="authForm">
            <label class="field">
              <input type="email" placeholder="E-mail" required>
            </label>

            <label class="field">
              <input type="password" placeholder="Password" required>
            </label>

            <button class="btn primary auth-action auth-action-login" type="submit">Login</button>
            <button class="btn primary auth-action auth-action-signup" type="submit">Sign Up</button>
          </form>

          <p class="signup">
            <span class="signup-copy signup-copy-login">Don't have an account?</span>
            <span class="signup-copy signup-copy-signup">Already have an account?</span>
            <a href="#" id="authToggle">Sign Up</a>
          </p>
        </aside>
      </main>

      <footer class="footer">
        <div class="footer-inner">
          <div class="f-col f-left">AI Got This</div>
          <div class="f-col f-center">
            <div class="phone"></div>
            <small></small>
          </div>
          <div class="f-col f-right">
            <ul>
              <li></li>
              <li></li>
              <li></li>
            </ul>
          </div>
        </div>
      </footer>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/keycloak-js/dist/keycloak.min.js"></script>
  <script src="login.js"></script>
</body>
</html>
