<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login — UnadØrned</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="stage">
    <div class="window">
      <header class="topbar">
        <div class="tb-left">
          <button class="hamburger" aria-label="menu">☰</button>
        </div>
        <div class="tb-center"></div>
        
      </header>

      <main class="hero">
        <div class="bg-placeholder" aria-hidden="true"></div>

        <aside class="login-card">
          <h1>Tradify</h1>
          <p class="lead">The market never sleeps. Neither do we.</p>

          <form class="login-form" onsubmit="return false;">
            <label class="field">
              <input type="email" placeholder="E-mail" required>
            </label>

            <label class="field">
              <input type="password" placeholder="Password" required>
            </label>

        

            <button class="btn primary" type="submit">Login</button>
          </form>

          <p class="signup">Don't have an account? <a href="#">Sign Up</a></p>
        </aside>
      </main>

      <footer class="footer">
        <div class="footer-inner">
          <div class="f-col f-left">AI Got This</div>
          <div class="f-col f-center">
            <div class="phone"></div>
            <small></small>
          </div>
          <div class="f-col f-right">
            <ul>
              <li></li>
              <li></li>
              <li></li>
            </ul>
          </div>
        </div>
      </footer>
    </div>
  </div>
</body>
</html>
