spring.application.name=market-data-service

# RabbitMQ connection
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=trading-bot-dev
spring.rabbitmq.password=1234
spring.rabbitmq.virtual-host=trading-bot-dev-vhost

#Alpaca API Config
alpaca.api.key=${ALPACA_API_KEY:}
alpaca.api.secret=${ALPACA_API_SECRET:}
alpaca.api.market-stream-url=wss://stream.data.alpaca.markets/v2/iex
alpaca.api.subscription-message={"action":"subscribe","bars":["*"]}
