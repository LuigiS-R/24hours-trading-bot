spring.application.name=account-service

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/accounts}
spring.datasource.username=${DATABASE_USERNAME:accounts}
spring.datasource.password=${DATABASE_PASSWORD:accounts}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# State the issuer of the JWT token (Keycloak)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/trading}

keycloak.token-url=${KEYCLOAK_TOKEN_URL:}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:account-service}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:}

alpaca.oauth.client-id=${ALPACA_OAUTH_CLIENT_ID:}
alpaca.oauth.client-secret=${ALPACA_OAUTH_CLIENT_SECRET:}

# Defines the URI to which the user will be redirected after authorizing the application.
# This URI performs the code-to-token logic.
alpaca.oauth.redirect-uri=${ALPACA_OAUTH_REDIRECT_URI:http://localhost:8081/api/v1/alpaca/oauth/callback}

# Alpaca endpoint for user authorization
alpaca.oauth.authorize-url=${ALPACA_OAUTH_AUTHORIZE_URL:https://app.alpaca.markets/oauth/authorize}

# Alpaca endpoint for exchanging authorization code for token
alpaca.oauth.token-url=${ALPACA_OAUTH_TOKEN_URL:https://api.alpaca.markets/oauth/token}

alpaca.paper-trading-base-url=${ALPACA_PAPER_TRADING_BASE_URL:https://paper-api.alpaca.markets}
alpaca.oauth.state-ttl=${OAUTH_STATE_TTL_SECONDS:600}
alpaca.reconciliation-interval=${ACCOUNT_RECONCILIATION_INTERVAL:PT5M}
alpaca.http.connect-timeout=${ALPACA_HTTP_CONNECT_TIMEOUT:PT3S}
alpaca.http.response-timeout=${ALPACA_HTTP_RESPONSE_TIMEOUT:PT10S}

app.frontend-oauth-success-url=${FRONTEND_OAUTH_SUCCESS_URL:http://localhost:3000/settings/connections/success}
app.frontend-oauth-failure-url=${FRONTEND_OAUTH_FAILURE_URL:http://localhost:3000/settings/connections/failure}

# Account Service exchanges these Keycloak client credentials for the JWT used to call Order Persister.
order-execution-persister.internal.base-url=${ORDER_EXECUTION_PERSISTER_INTERNAL_BASE_URL:http://localhost:8083}
