spring.application.name=account-service
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/accounts}
spring.datasource.username=${DATABASE_USERNAME:accounts}
spring.datasource.password=${DATABASE_PASSWORD:accounts}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
# One paper-trading account is configured for the whole installation. Inject
# both values through deployment secrets; never commit them.
alpaca.api.key=${ALPACA_API_KEY:}
alpaca.api.secret=${ALPACA_API_SECRET:}
alpaca.api.paper-trading-base-url=${ALPACA_PAPER_TRADING_BASE_URL:https://paper-api.alpaca.markets}
alpaca.reconciliation-interval=${ACCOUNT_RECONCILIATION_INTERVAL:PT5M}
order-execution-persister.internal.base-url=${ORDER_EXECUTION_PERSISTER_INTERNAL_BASE_URL:http://localhost:8085}
