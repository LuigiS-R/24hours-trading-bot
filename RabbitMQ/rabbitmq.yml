---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: trading-bot
data:
  rabbitmq.conf: |
    definitions.import_backend = local_filesystem
    definitions.local.path = /etc/rabbitmq/definitions/definitions.json

---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: trading-bot
spec:
  clusterIP: None
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: trading-bot
spec:
  serviceName: rabbitmq
  replicas: 1

  selector:
    matchLabels:
      app: rabbitmq

  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:management-alpine
          imagePullPolicy: Always

          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672

          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
            - name: rabbitmq-definitions
              mountPath: /etc/rabbitmq/definitions
              readOnly: true
            - name: rabbitmq-config
              mountPath: /etc/rabbitmq/rabbitmq.conf
              subPath: rabbitmq.conf
              readOnly: true

      volumes:
        - name: rabbitmq-definitions
          secret:
            secretName: rabbitmq-definitions
        - name: rabbitmq-config
          configMap:
            name: rabbitmq-config

  volumeClaimTemplates:
    - metadata:
        name: rabbitmq-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 100Mi
